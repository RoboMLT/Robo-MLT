# Atomic-skill library S for Task 2: blood sample tube sorting (N_s = 5).
#
# Two tube categories share the rack: routine blood tubes and sodium-citrate (coagulation) tubes.
# Which plate each category goes to is part of the task instruction given to the planner, and must
# match the task text stored in the dataset's meta/tasks.parquet.
#
# canonical_instruction values must stay BYTE-FOR-BYTE identical to meta/subtasks.parquet of the
# training data, in subtask_index order (checked by high_level_model.data.dataset_stats).
#
# Keyboard digits 1-5 jump the plan pointer to the skill in declaration order (operator override,
# not part of the method); 0 prints the current plan.
skills:
  - skill_id: grasp_routine_blood_tube
    canonical_instruction: "grasp the routine blood tube."
    precondition_text: "The gripper is empty and at least one routine blood tube remains on the rack"
    postcondition_text: "The gripper is closed and holding a routine blood tube"
    system1_policy_ref: "bloodtube_sorting/grasp_routine_blood_tube"

  - skill_id: grasp_sodium_citrate_tube
    canonical_instruction: "grasp the sodium citrate tube."
    precondition_text: "The gripper is empty and at least one sodium citrate tube remains on the rack"
    postcondition_text: "The gripper is closed and holding a sodium citrate tube"
    system1_policy_ref: "bloodtube_sorting/grasp_sodium_citrate_tube"

  - skill_id: place_to_orange_plate
    canonical_instruction: "drop the tube into the orange plate."
    precondition_text: "The gripper is holding a tube and the orange plate has free space"
    postcondition_text: "The tube is released into the orange plate and the gripper is empty"
    system1_policy_ref: "bloodtube_sorting/place_to_orange_plate"

  - skill_id: place_to_blue_plate
    canonical_instruction: "place to the blue plate."
    precondition_text: "The gripper is holding a tube and the blue plate has free space"
    postcondition_text: "The tube is released into the blue plate and the gripper is empty"
    system1_policy_ref: "bloodtube_sorting/place_to_blue_plate"

  - skill_id: return_home
    canonical_instruction: "return to the home position."
    precondition_text: "The gripper is empty after sorting all sample tubes"
    postcondition_text: "The arm is back at the starting home pose"
    system1_policy_ref: "bloodtube_sorting/return_home"

# Instrument protocol and the hard ordering constraints every executed plan must satisfy
# (paper Sec. III-B); see planning/protocol.py.
protocol:
  text: |
    Every tube on the rack is sorted exactly once: grasp it, then place it into the plate assigned
    to its category by the task instruction. A plate may only receive a tube that was grasped
    after the previous placement. The arm returns home exactly once, after the last tube.
  terminal: [return_home]
  # One admissible pass for the offline fallback planner (no LLM); follows the task instruction.
  cycle: [grasp_sodium_citrate_tube, place_to_orange_plate,
          grasp_routine_blood_tube, place_to_blue_plate]
  rules:
    - skill: place_to_orange_plate
      after: [grasp_routine_blood_tube, grasp_sodium_citrate_tube]
      since: [place_to_orange_plate, place_to_blue_plate]
    - skill: place_to_blue_plate
      after: [grasp_routine_blood_tube, grasp_sodium_citrate_tube]
      since: [place_to_orange_plate, place_to_blue_plate]
