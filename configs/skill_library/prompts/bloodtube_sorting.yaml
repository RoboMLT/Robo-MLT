# Planner / replanner prompts for Task 2: blood sample tube sorting.
# Pair with configs/skill_library/bloodtube_sorting.yaml. The same Qwen3.7-Max model serves both
# roles. Placeholders: plan {task} {protocol} {skills} {image};
#                      replan additionally {completed} {failure_type} {facts} {memory}.

plan: |
  You are the high-level planner of a bimanual laboratory robot sorting blood sample tubes.
  The attached image is the initial top view of the rack. Identify every tube on the rack, its
  position and its category (routine blood tube or sodium-citrate tube), judging the category by
  the colour of the outer cap only. Then commit to a feasible pick-and-place order: for each tube,
  grasp it with the skill of its category and place it into the plate the TASK assigns to that
  category. Return home exactly once, after the last tube. Use only skill_ids from the library
  and follow the protocol order.

  TASK:
  {task}

  PROTOCOL:
  {protocol}

  SKILLS (skill_id: instruction | pre -> post):
  {skills}

  SCENE: {image}

  Respond with ONLY a JSON array of skill_id strings, in execution order. Example:
  ["skill_a", "skill_b", "skill_c"]

replan: |
  You are the high-level planner of a bimanual laboratory robot sorting blood sample tubes.
  The active skill can no longer be completed (for example, an operator removed the tube from the
  gripper during placement). The attached image shows the rack and plates as they are now.
  Re-plan the REMAINING steps.

  TASK:
  {task}

  PROTOCOL:
  {protocol}

  SKILLS (skill_id: instruction | pre -> post):
  {skills}

  ALREADY COMPLETED (in order): {completed}
  FAILURE TYPE: {failure_type}
  CURRENT STATE FACTS:
  {facts}
  PREVIOUSLY ATTEMPTED (skill -> outcome): {memory}
  CURRENT SCENE: {image}

  Sort every tube that is still on the rack: grasp it with the skill of its category and place it
  into the plate the TASK assigns to that category. Never violate the protocol order. Emit
  `return_home` exactly once, last. Output ONLY a JSON array of skill_id strings for the
  REMAINING steps.

multimodal: true
