# Baseline: pi0 (PaliGemma + flow-matching action expert) — Task 2: blood sample tube sorting.
# Fine-tuned from the official lerobot/pi0_base checkpoint on the same corpus and with the
# same schedule as System 1 (Sec. IV-A-4).
#
#   python -m low_level_model.training.train_system1 configs/system1/train/tube_sorting/pi0.yaml

policy:
  type: pi0_system1
  pretrained_path: lerobot/pi0_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda:0
  chunk_size: 30
  n_action_steps: 30
  gradient_checkpointing: false
  fuse_qkv: false
  fuse_gate_up: false
  compile_model: false

# ── Dataset: nominal corpus only (recovery episodes are kept out) ────────────
dataset:
  repo_id: <path/to>/RoboMLT-Lab/tube_sorting
  root: null
  video_backend: pyav
  use_imagenet_stats: true
  filter_back_events: true
  skill_library: configs/skill_library/bloodtube_sorting.yaml      # per-frame atomic-skill instruction
  subtask_index_column: subtask_index

output_dir: outputs/system1/tube_sorting/pi0
job_name: pi0_tube_sorting
# ── Training loop (shared by System 1 and every baseline) ───────────────────
batch_size: 8
steps: 80000
num_workers: 4
seed: 1000
grad_accum_steps: 1
resume: false

optimizer:
  lr: 2.5e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip_norm: 1.0

# ── LR scheduler: linear warm-up, then cosine decay over the remaining steps ─
scheduler:
  warmup_steps: 1000
  decay_steps: 79000
  decay_lr: 2.5e-6

# ── Checkpointing ────────────────────────────────────────────────────────────
save_checkpoint: true
save_freq: 10000
log_freq: 50

wandb:
  enable: false
  mode: offline
  project: RoboMLT_system1
  entity: ""
  disable_artifact: true

# Action-delay augmentation: offsets drawn from [0, max_delay_steps], all offsets per observation.
max_delay_steps: 6
shared_observation: true
