# Baseline: SmolVLA (SmolVLM2 + flow-matching action expert) — Task 1: blood gas analysis.
# Fine-tuned from the official lerobot/smolvla_base checkpoint on the same corpus and with
# the same schedule as System 1 (Sec. IV-A-4).
#
#   python -m low_level_model.training.train_system1 configs/system1/train/blood_gas_analysis/smolvla.yaml

policy:
  type: smolvla
  device: cuda:0
  pretrained_path: lerobot/smolvla_base
  chunk_size: 30
  n_action_steps: 30
  max_state_dim: 32
  max_action_dim: 32
  vlm_model_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  load_vlm_weights: true
  freeze_vision_encoder: false
  train_expert_only: false
  num_steps: 10                    # flow-matching integration steps at inference

# ── Dataset: nominal corpus only (recovery episodes are kept out) ────────────
dataset:
  repo_id: <path/to>/RoboMLT-Lab/blood_gas_analysis
  root: null
  video_backend: pyav
  use_imagenet_stats: false
  filter_back_events: true
  skill_library: configs/skill_library/bloodgas.yaml      # per-frame atomic-skill instruction
  subtask_index_column: subtask_index
  mask_cross_subtask_actions: true

output_dir: outputs/system1/blood_gas_analysis/smolvla
job_name: smolvla_blood_gas_analysis
# ── Training loop (shared by System 1 and every baseline) ───────────────────
batch_size: 8
steps: 80000
num_workers: 4
seed: 1000
grad_accum_steps: 1
resume: false

optimizer:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-10
  grad_clip_norm: 10.0

# ── LR scheduler: linear warm-up, then cosine decay over the remaining steps ─
scheduler:
  warmup_steps: 1000
  decay_steps: 79000
  decay_lr: 2.5e-6

# ── Checkpointing ────────────────────────────────────────────────────────────
save_checkpoint: true
save_freq: 10000
log_freq: 50

wandb:
  enable: false
  mode: offline
  project: RoboMLT_system1
  entity: ""
  disable_artifact: true

max_delay_steps: 0
shared_observation: false
