# Baseline: ACT (action-chunking transformer, no language input) — Task 1: blood gas analysis.
# Same corpus and schedule as System 1 (Sec. IV-A-4); ResNet-18 backbone from ImageNet.
#
#   python -m low_level_model.training.train_system1 configs/system1/train/blood_gas_analysis/act.yaml

policy:
  type: act
  device: cuda:0
  n_obs_steps: 1
  chunk_size: 30
  n_action_steps: 30
  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  dim_model: 512
  n_heads: 8
  dim_feedforward: 3200
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 32
  kl_weight: 10.0
  dropout: 0.1
  optimizer_lr_backbone: 1.0e-5

# ── Dataset: nominal corpus only (recovery episodes are kept out) ────────────
dataset:
  repo_id: <path/to>/RoboMLT-Lab/blood_gas_analysis
  root: null
  video_backend: pyav
  use_imagenet_stats: false
  filter_back_events: true
  skill_library: None      # per-frame atomic-skill instruction
  subtask_index_column: subtask_index

output_dir: outputs/system1/blood_gas_analysis/act
job_name: act_blood_gas_analysis
# ── Training loop (shared by System 1 and every baseline) ───────────────────
batch_size: 8
steps: 80000
num_workers: 4
seed: 1000
grad_accum_steps: 1
resume: false

optimizer:
  lr: 1.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-4
  grad_clip_norm: 10.0

# ── LR scheduler: linear warm-up, then cosine decay over the remaining steps ─
scheduler:
  warmup_steps: 1000
  decay_steps: 79000
  decay_lr: 1.0e-6

# ── Checkpointing ────────────────────────────────────────────────────────────
save_checkpoint: true
save_freq: 10000
log_freq: 50

wandb:
  enable: false
  mode: offline
  project: RoboMLT_system1
  entity: ""
  disable_artifact: true

max_delay_steps: 0
shared_observation: false
