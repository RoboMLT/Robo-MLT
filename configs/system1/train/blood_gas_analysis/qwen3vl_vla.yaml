# System 1 (Robo-MLT executor): Qwen3-VL-2B + flow-matching action head — Task 1: blood gas analysis.
# Paper Sec. III-C and Table II: backbone and action head fine-tuned jointly,
# AdamW, lr 1e-4 with cosine decay, batch 8, 80k steps, action chunk N = 30.
# Qwen3-VL needs transformers>=4.57.
#
#   python -m low_level_model.training.train_system1 configs/system1/train/blood_gas_analysis/qwen3vl_vla.yaml

# ── Policy ───────────────────────────────────────────────────────────────────
policy:
  type: qwen3vl_vla
  device: cuda:0
  vlm_model_id: Qwen/Qwen3-VL-2B-Instruct
  # The paper fine-tunes from the released StarVLA weights. Point this at that checkpoint in this
  # policy's format (config.json + model.safetensors); null starts the backbone from vlm_model_id
  # and the action head from scratch.
  pretrained_path: null
  attn_implementation: sdpa        # or flash_attention_2 if installed
  dtype: bfloat16
  freeze_vlm: false                # backbone + action head are both trained
  optimizer_lr: 1.0e-4             # action-head peak lr
  vlm_lr: 1.0e-4                   # backbone peak lr
  chunk_size: 30
  n_action_steps: 30
  max_state_dim: 32
  max_action_dim: 32
  num_inference_timesteps: 4       # Euler integration steps at inference
  num_target_vision_tokens: 32
  attention_head_dim: 64
  num_timestep_buckets: 1000
  add_pos_embed: true
  dit_dropout: 0.2
  repeated_diffusion_steps: 2
  gradient_checkpointing: true

# ── Dataset: nominal corpus only (recovery episodes are kept out) ────────────
dataset:
  repo_id: <path/to>/RoboMLT-Lab/blood_gas_analysis
  root: null
  video_backend: pyav
  use_imagenet_stats: false
  filter_back_events: true
  skill_library: configs/skill_library/bloodgas.yaml      # per-frame atomic-skill instruction
  subtask_index_column: subtask_index

output_dir: outputs/system1/blood_gas_analysis/qwen3vl_vla
job_name: qwen3vl_vla_blood_gas_analysis
# ── Training loop (shared by System 1 and every baseline) ───────────────────
batch_size: 8
steps: 80000
num_workers: 4
seed: 1000
grad_accum_steps: 1
resume: false

# ── Optimizer (lr is the reference for the schedule; group lrs come from the policy) ──
optimizer:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip_norm: 1.0

# ── LR scheduler: linear warm-up, then cosine decay over the remaining steps ─
scheduler:
  warmup_steps: 1000
  decay_steps: 79000
  decay_lr: 1.0e-6

# ── Checkpointing ────────────────────────────────────────────────────────────
save_checkpoint: true
save_freq: 10000
log_freq: 50

wandb:
  enable: false
  mode: offline
  project: RoboMLT_system1
  entity: ""
  disable_artifact: true

max_delay_steps: 0
shared_observation: false
