# System 1 — Qwen3VL-VLA (layer-wise flow-matching) training configuration.
# Usage:
#   python -m low_level_model.training.train_system1 configs/system1/train/qwen3vl_vla.yaml
# Override keys via CLI, e.g.:
#   ... qwen3vl_vla.yaml batch_size=4 policy.vlm_model_id=Qwen/Qwen2.5-VL-3B-Instruct
#
# NOTE: Qwen3-VL needs transformers>=4.57. If your install is older, point
# `policy.vlm_model_id` at a Qwen2.5-VL checkpoint (e.g. Qwen/Qwen2.5-VL-3B-Instruct);
# the backbone auto-selects the matching transformers class.

# ── Policy ───────────────────────────────────────────────────────────────────
policy:
  type: qwen3vl_vla
  device: cuda:0
  vlm_model_id: Qwen/Qwen3-VL-2B-Instruct
  attn_implementation: sdpa        # or flash_attention_2 if installed
  dtype: bfloat16
  freeze_vlm: false
  chunk_size: 30
  n_action_steps: 30
  max_state_dim: 32
  max_action_dim: 32
  # Layer-wise flow-matching DiT action head
  num_inference_timesteps: 4
  num_target_vision_tokens: 32
  attention_head_dim: 64
  num_timestep_buckets: 1000
  add_pos_embed: true
  dit_dropout: 0.2
  repeated_diffusion_steps: 2
  gradient_checkpointing: true

# ── Dataset ──────────────────────────────────────────────────────────────────
dataset:
  repo_id: <path/to/data>/PickandPlaceTube_0614
  root: null
  video_backend: pyav
  use_imagenet_stats: false        # images pass through (VISUAL: IDENTITY); Qwen processor normalises
  filter_back_events: true
  # Per-frame atomic-skill language conditioning — same semantics as the PI0 config.
  skill_library: null
  subtask_index_column: subtask_index

# ── Training loop ─────────────────────────────────────────────────────────────
output_dir: outputs/train_vla/qwen3vl_vla_PickandPlaceTube_0614
job_name: qwen3vl_vla_system1
batch_size: 4
steps: 50000
num_workers: 4
seed: 1000
grad_accum_steps: 1
resume: false

# ── Optimizer (action-head peak LR; VLM uses policy.vlm_lr internally) ────────
optimizer:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip_norm: 1.0

# ── LR Scheduler (cosine warm-up then decay) ─────────────────────────────────
scheduler:
  warmup_steps: 1000
  decay_steps: 30000
  decay_lr: 1.0e-6

# ── Checkpointing ─────────────────────────────────────────────────────────────
save_checkpoint: true
save_freq: 10000
log_freq: 50

# ── Weights & Biases ─────────────────────────────────────────────────────────
wandb:
  enable: false
  mode: offline
  project: RoboMLT_system1
  entity: xdedm7-chongqing-university
  disable_artifact: true

# Qwen3VL-VLA has no shared-observation / delay-augmentation support — keep both off.
max_delay_steps: 0
shared_observation: false
